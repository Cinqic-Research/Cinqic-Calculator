name: Test Android

# Builds an UNSIGNED DEBUG APK only, for CI-based verification of the
# Kivy/Buildozer packaging itself (installability, package ID, permissions,
# launchability). No keystore, no secrets, nothing published. The signed
# release build lives in release-android.yml and only runs on an
# android-v* tag.

on:
  pull_request:
    paths:
      - "android/**"
      - "src/cinqic_calculator/**"
      - "tests/test_android_glue.py"
      - ".github/workflows/test-android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/cinqic_calculator/**"
  workflow_dispatch:

# Only one run per branch/PR: pushing again supersedes the previous run
# rather than leaving two multi-minute Android builds racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-glue-tests:
    # The pure-Python android/logic.py glue and its tests need no Kivy or
    # Android tooling at all -- a fast, cheap signal before the much slower
    # buildozer build below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-build.txt

      - name: Lint
        run: ruff check src tests android scripts

      - name: Run full suite (desktop + android glue)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest tests/ -v

  build-debug-apk:
    needs: android-glue-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Buildozer's native build dependencies
        # Installed directly, not via a third-party Docker action -- avoids
        # depending on an external image/PPA staying compatible with
        # whatever Ubuntu release the runner image ships next.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer and Cython
        run: pip install -r android/requirements-android.txt

      - name: Cache Buildozer's Android SDK/NDK downloads
        # Deliberately narrow: only the downloaded SDK/NDK/build-tools
        # (large, slow to fetch, never change between runs). NOT the
        # build-*/  directories (compiled recipes, target venvs) -- a
        # partially-built venv or recipe from a prior *failed* run being
        # restored here previously corrupted a later run's pip install.
        # Those directories are cheap to rebuild fresh every time.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
            ~/.buildozer/android/platform/apache-ant-*
          key: buildozer-android-sdk-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: Bundle the shared core into the Android source tree
        # buildozer.spec's source.dir is android/, and buildozer only
        # packages files under source.dir. cinqic_calculator has zero
        # third-party dependencies, so a plain copy is sufficient.
        run: cp -r src/cinqic_calculator android/cinqic_calculator

      - name: Build debug APK with Buildozer
        # First run downloads the Android SDK/NDK, so this can take a
        # while. Buildozer caches under ~/.buildozer between runs.
        working-directory: android
        run: yes | buildozer -v android debug

      - name: Locate built APK
        id: apk
        run: |
          apk_path=$(find android/bin -maxdepth 1 -name "*-debug.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No debug APK found under android/bin" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Inspect package identity and permissions
        run: python3 scripts/inspect_android_apk.py "${{ steps.apk.outputs.path }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinqic-calculator-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

  build-emulator-apk:
    # A SEPARATE x86_64-only build, used only to smoke-test in the
    # emulator-verify job below. GitHub-hosted runners are x86_64 hosts;
    # KVM only accelerates same-architecture emulation, so an
    # arm64-v8a/armeabi-v7a APK (the real build-debug-apk artifact, which
    # matches an actual phone) would need slow, timeout-prone software
    # ARM translation here. This job's APK is for CI verification only
    # and is never published anywhere a user would download it from.
    needs: android-glue-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Buildozer's native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer and Cython
        run: pip install -r android/requirements-android.txt

      - name: Cache Buildozer's Android SDK/NDK downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
            ~/.buildozer/android/platform/apache-ant-*
          key: buildozer-android-sdk-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: Bundle the shared core into the Android source tree
        run: cp -r src/cinqic_calculator android/cinqic_calculator

      - name: Override android.archs to x86_64 for this emulator-only build
        run: sed -i 's/^android.archs = .*/android.archs = x86_64/' android/buildozer.spec

      - name: Build x86_64 debug APK with Buildozer
        working-directory: android
        run: yes | buildozer -v android debug

      - name: Locate built APK
        id: apk
        run: |
          apk_path=$(find android/bin -maxdepth 1 -name "*-debug.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No debug APK found under android/bin" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload x86_64 emulator-test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinqic-calculator-emulator-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1

  emulator-verify:
    needs: build-emulator-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download x86_64 emulator-test APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cinqic-calculator-emulator-apk
          path: apk

      - name: Locate downloaded APK
        id: apk
        run: |
          apk_path=$(find apk -maxdepth 1 -name "*-debug.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No debug APK found in downloaded artifact" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for the emulator
        # GitHub-hosted Ubuntu runners support nested virtualization, but
        # the kvm device needs group permissions opened up first.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the ADB verification script
        # reactivecircus/android-emulator-runner's `script:` field executes
        # each line as a SEPARATE `sh -c` invocation (confirmed from a real
        # CI run's log: one "[command]/usr/bin/sh -c <line>" per line) --
        # shell variables, `set -e`, and multi-line if/then/fi do not
        # survive across lines there. Writing the real logic to a file via
        # a normal `run:` step (a single, ordinary shell session, no such
        # quirk) and having the emulator-runner step just invoke that one
        # file sidesteps the whole problem.
        run: |
          cat > "$RUNNER_TEMP/emulator-verify.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$1"
          PKG=com.cinqic.calculator
          ACTIVITY=$PKG/org.kivy.android.PythonActivity

          # Key centres on the pixel_5 profile this job pins (1080x2340).
          # Used only for the screenshot/interaction steps; the crash and
          # permission checks below do not depend on them.
          MULTIPLY_X=928; MULTIPLY_Y=1220
          PLUS_X=928;     PLUS_Y=1769
          EQUALS_X=928;   EQUALS_Y=2047
          FX_X=950;       FX_Y=205

          fail_on_crash() {
            local logfile="$1"
            if grep -q "FATAL EXCEPTION" "$logfile" || grep -q "Python for android ended." "$logfile"; then
              echo "Crash detected in $logfile" >&2
              grep -B5 -A30 "FATAL EXCEPTION\|Traceback" "$logfile" >&2 || true
              exit 1
            fi
          }

          echo "--- adb install ---"
          adb install -r "$APK"

          echo "--- package appears in pm list ---"
          adb shell pm list packages | grep "$PKG"

          echo "--- permissions: the app must request none ---"
          # The zero-permission guarantee is a headline privacy claim, so
          # assert it against the installed package, not just the manifest.
          granted=$(adb shell dumpsys package "$PKG" | sed -n '/requested permissions:/,/^ *$/p' | grep -v "requested permissions:" | tr -d ' \r' | grep -v '^$' || true)
          if [ -n "$granted" ]; then
            echo "Unexpected permissions requested by $PKG:" >&2
            echo "$granted" >&2
            exit 1
          fi
          echo "confirmed: no permissions requested"

          echo "--- cold launch ---"
          adb logcat -c
          adb shell am start -n "$ACTIVITY"
          sleep 20
          adb shell pidof "$PKG"
          adb logcat -d > /tmp/logcat-launch.txt
          fail_on_crash /tmp/logcat-launch.txt

          echo "--- drive real input through the hardware-key path ---"
          # A mix of typed text, hardware key events, and real taps on the
          # on-screen keys -- together these exercise entry, the live
          # preview, equals, repeated equals, backspace and rapid input
          # through both paths the app accepts.
          adb logcat -c
          # 125 x 24 -- stop short of "=" so the live preview is on screen.
          #
          # Digits go through `input text`, but the operator is a real TAP on
          # the on-screen key. Neither keyboard route works for "x":
          # KEYCODE_STAR produces no text-input event at all, and `input text`
          # sends "*" as an unshifted "8". Tapping is also the better test --
          # it exercises the touch path a user actually takes, through
          # CalcButton, rather than the hardware-keyboard fallback.
          echo "screen size: $(adb shell wm size)"
          adb shell input text "125"
          sleep 1
          adb shell input tap $MULTIPLY_X $MULTIPLY_Y
          sleep 1
          adb shell input text "24"
          sleep 2

          # Capture the live preview from the real device. This is the
          # flagship feature, so the evidence for it should be a genuine
          # emulator screenshot rather than a desktop rendering.
          adb exec-out screencap -p > /tmp/emulator-live-preview.png || true

          adb shell input tap $EQUALS_X $EQUALS_Y
          sleep 2
          adb exec-out screencap -p > /tmp/emulator-result.png || true
          # Backspace stays a key event, which does exercise the app's
          # hardware-key path (it is handled by key code, not codepoint).
          # The operator and equals are taps, for the reason above.
          adb shell input keyevent KEYCODE_DEL
          adb shell input text "7"
          adb shell input tap $PLUS_X $PLUS_Y
          adb shell input text "3"
          adb shell input tap $EQUALS_X $EQUALS_Y
          sleep 1
          # Press equals a second time: 7 + 3 = 10, then = 13.
          adb shell input tap $EQUALS_X $EQUALS_Y
          sleep 2
          adb exec-out screencap -p > /tmp/emulator-repeated-equals.png || true
          # rapid entry: must not drop input or wedge the UI thread
          adb shell input text "1234567890"
          sleep 2
          adb shell input keyevent KEYCODE_ESCAPE
          sleep 1

          echo "--- still alive after all that input ---"
          adb shell pidof "$PKG"
          adb logcat -d > /tmp/logcat-input.txt
          fail_on_crash /tmp/logcat-input.txt

          echo "--- confirm the app is still the foreground activity ---"
          adb shell dumpsys activity activities | grep -q "$PKG" || {
            echo "App is no longer running an activity" >&2; exit 1; }

          echo "--- capture the scientific sheet ---"
          # Tap the "fx" key (top-right) to open the scientific sheet.
          adb shell input tap $FX_X $FX_Y
          sleep 2
          adb exec-out screencap -p > /tmp/emulator-scientific.png || true
          adb shell input keyevent KEYCODE_ESCAPE
          sleep 1

          echo "--- background and restore, to confirm no state corruption ---"
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb shell am start -n "$ACTIVITY"
          sleep 10
          adb shell pidof "$PKG"

          echo "--- force-stop and relaunch, to confirm a clean restart ---"
          adb shell am force-stop "$PKG"
          sleep 2
          adb logcat -c
          adb shell am start -n "$ACTIVITY"
          sleep 20
          adb shell pidof "$PKG"
          adb logcat -d > /tmp/logcat-restart.txt
          fail_on_crash /tmp/logcat-restart.txt

          echo "--- uninstall cleanly ---"
          adb uninstall "$PKG"

          echo "All emulator checks passed."
          SCRIPT
          chmod +x "$RUNNER_TEMP/emulator-verify.sh"

      - name: Install, launch, and verify on an emulator via ADB
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          script: "\"$RUNNER_TEMP/emulator-verify.sh\" \"${{ steps.apk.outputs.path }}\""

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-evidence
          path: |
            /tmp/emulator-*.png
            /tmp/logcat-*.txt
          if-no-files-found: ignore
          retention-days: 7
