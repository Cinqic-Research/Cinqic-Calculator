name: Android Release

# Builds, signs, and publishes the Android release APK. Only runs on an
# android-v* tag, and only publishes if every prior step succeeds. Requires
# these repository secrets to exist (see android/README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Until those secrets are configured, this workflow will fail at the
# "Decode signing keystore" step rather than publish an unsigned or
# improperly-signed APK.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

# Deliberately no cancel-in-progress: a release must never be interrupted
# part-way through building or uploading its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-build.txt

      - name: Run the complete test suite (desktop + android glue)
        run: python -m pytest tests/ -v

      - name: Lint
        run: ruff check src tests android

      - name: Install Buildozer's native build dependencies
        # Installed directly, not via a third-party Docker action -- avoids
        # depending on an external image/PPA staying compatible with
        # whatever Ubuntu release the runner image ships next.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer and Cython
        run: pip install -r android/requirements-android.txt

      - name: Cache Buildozer's Android SDK/NDK downloads
        # Deliberately narrow: only the downloaded SDK/NDK/build-tools
        # (large, slow to fetch, never change between runs). NOT the
        # build-*/  directories (compiled recipes, target venvs) -- a
        # partially-built venv or recipe from a prior *failed* run being
        # restored here previously corrupted a later run's pip install.
        # Those directories are cheap to rebuild fresh every time.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
            ~/.buildozer/android/platform/apache-ant-*
          key: buildozer-android-sdk-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: Bundle the shared core into the Android source tree
        run: cp -r src/cinqic_calculator android/cinqic_calculator

      - name: Build release APK with Buildozer
        # First run downloads the Android SDK/NDK, so this can take a
        # while. Buildozer caches under ~/.buildozer between runs.
        working-directory: android
        run: yes | buildozer -v android release

      - name: Locate unsigned release APK
        id: unsigned_apk
        run: |
          apk_path=$(find android/bin -maxdepth 1 -name "*-release-unsigned.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No unsigned release APK found under android/bin" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set. Refusing to publish an unsigned APK." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Find Android build-tools
        id: build_tools
        run: |
          # Buildozer downloads its own SDK under ~/.buildozer (not a
          # system $ANDROID_HOME) when installed natively via pip, so
          # search there directly rather than assuming that env var.
          #
          # Two steps deliberately: `find ... -path "*build-tools/*"`
          # (what this used to be) matches ANY nested directory under
          # build-tools/, not just its direct version subdirectories -
          # it actually matched build-tools/37.0.0/renderscript/ (sorts
          # after "37.0.0" alphabetically) instead of build-tools/37.0.0/
          # itself, and zipalign doesn't exist in that renderscript dir.
          build_tools_root=$(find "$HOME/.buildozer" -maxdepth 6 -type d -name "build-tools" | head -n1)
          if [ -z "$build_tools_root" ]; then
            echo "No build-tools directory found under ~/.buildozer" >&2
            exit 1
          fi
          bt_dir=$(find "$build_tools_root" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          if [ -z "$bt_dir" ] || [ ! -x "$bt_dir/zipalign" ]; then
            echo "No usable build-tools version (with zipalign) found under $build_tools_root" >&2
            exit 1
          fi
          echo "dir=$bt_dir" >> "$GITHUB_OUTPUT"

      - name: Zip-align the unsigned APK
        run: |
          "${{ steps.build_tools.outputs.dir }}/zipalign" -v -p 4 \
            "${{ steps.unsigned_apk.outputs.path }}" \
            "$RUNNER_TEMP/Cinqic-Calculator-Android-aligned.apk"

      - name: Sign the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "${{ steps.build_tools.outputs.dir }}/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out Cinqic-Calculator-Android.apk \
            "$RUNNER_TEMP/Cinqic-Calculator-Android-aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the release signature
        run: |
          "${{ steps.build_tools.outputs.dir }}/apksigner" verify --print-certs Cinqic-Calculator-Android.apk \
            | tee "$RUNNER_TEMP/apksigner-verify.txt"
          echo "---"
          echo "Certificate fingerprint(s) (also included in the release notes):"
          grep -i "sha-256" "$RUNNER_TEMP/apksigner-verify.txt" || true

      - name: Inspect package identity, version, and permissions
        # The expected version comes from android_constants.py, which
        # tests/test_packaging.py already ties to buildozer.spec and to the
        # desktop version -- so a release built from a stale spec fails here
        # rather than shipping with last version's number.
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'android'); import android_constants as c; print(c.ANDROID_APP_VERSION)")
          CODE=$(python3 -c "import sys; sys.path.insert(0, 'android'); import android_constants as c; print(c.ANDROID_VERSION_CODE)")
          echo "Expecting version $VERSION (versionCode $CODE)"
          python3 scripts/inspect_android_apk.py Cinqic-Calculator-Android.apk \
            --expect-version "$VERSION" --expect-version-code "$CODE"

      - name: Generate SHA-256 checksums
        run: python3 scripts/calculate_checksum.py SHA256SUMS-Android.txt Cinqic-Calculator-Android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Cinqic-Calculator-Android.apk
            SHA256SUMS-Android.txt
          body: |
            ## Cinqic Calculator for Android ${{ github.ref_name }}

            A private, offline calculator for Android. Standard and
            scientific math, unit conversion, financial tools, and local
            history and settings -- no account, no ads, and no internet
            permission.

            **Package:** `com.cinqic.calculator`

            ### What's new
            - **Live answers.** The full expression stays on screen and the
              result appears as you type, before you press `=`.
            - **A tactile keypad.** Keys respond with a short spring press
              and new digits animate into the display. A reduced-motion
              setting turns the movement off while keeping instant feedback.
            - **Redesigned scientific mode**, now a grouped sheet that slides
              up over the keypad instead of an endless vertical grid.
            - **A simpler layout** -- one keypad with `=` in it, backspace
              beside the display, and memory moved into the scientific sheet.
            - **More maths:** parentheses, `x^y`, `Ans`, exponentials, and
              inverse trigonometry.
            - **Optional haptics**, using Android's built-in key-press
              feedback -- still no permissions requested.
            - Now licensed under **Apache License 2.0**.

            ### Privacy
            Works fully offline. No account, telemetry, analytics, or ads.
            See [PRIVACY.md](https://github.com/${{ github.repository }}/blob/main/PRIVACY.md).

            ### Juniper
            Juniper is not integrated into Cinqic Calculator. The calculator
            works fully without AI.

            ### Install
            This is a direct APK download, not a Play Store listing.
            Download `Cinqic-Calculator-Android.apk`, then allow "install
            unknown apps" for your browser or file manager when prompted.

            ### Verify your download
            Checksum: `SHA256SUMS-Android.txt` in this release.
            Signing certificate fingerprint: printed in this workflow's
            "Verify the release signature" step log.

            Source: https://github.com/${{ github.repository }}
